<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Back soon — Act On Issues</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 32px 16px;
      display: flex; align-items: center; justify-content: center; text-align: center;
      background: #0f172a; color: #e2e8f0; font-family: system-ui, sans-serif;
    }
    .c { max-width: 520px; width: 100%; }
    h1 { font-size: 2rem; margin: 0 0 12px; }
    p { line-height: 1.6; color: #cbd5e1; }
    a { color: #7dd3fc; }
    .timer { display: flex; justify-content: center; gap: 12px; margin-top: 28px; }
    .unit { background: #1e293b; border-radius: 12px; padding: 16px 0; width: 96px; }
    .num { display: block; font-size: 2.5rem; font-weight: 700; font-variant-numeric: tabular-nums; color: #fff; }
    .label { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: #cbd5e1; }
    .sep { font-size: 2.5rem; font-weight: 700; align-self: center; color: #cbd5e1; }
    .bar { height: 6px; background: #334155; border-radius: 3px; margin: 28px auto 0; max-width: 336px; overflow: hidden; }
    .fill { height: 100%; width: 0; background: #38bdf8; transition: width 1s linear; }
    .note { font-size: .85rem; margin-top: 14px; }
{{GAME_CSS}}
    @media (max-width: 400px) { .unit { width: 76px; } .num, .sep { font-size: 2rem; } }
  </style>
</head>
<body>
  <div class="c">
    <h1>We'll be back soon</h1>
    <p>{{MESSAGE}}</p>
    {{CONTACT}}
    <div class="timer" role="timer" aria-live="off">
      <div class="unit"><span class="num" id="h">01</span><span class="label">Hours</span></div>
      <span class="sep">:</span>
      <div class="unit"><span class="num" id="m">00</span><span class="label">Minutes</span></div>
      <span class="sep">:</span>
      <div class="unit"><span class="num" id="s">00</span><span class="label">Seconds</span></div>
    </div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <p class="note">Estimated time remaining</p>

{{GAME}}
  </div>

  <script>
    // 1-hour countdown that restarts at zero. Anchored to a fixed start time
    // so every visitor sees the same number and a refresh doesn't reset it.
    var START = '{{START}}';
    var CYCLE = 3600 * 1000;
    var anchor = START ? new Date(START).getTime() : 0;
    if (isNaN(anchor)) anchor = 0;
    function pad(n) { return (n < 10 ? '0' : '') + n; }
    function tick() {
      var elapsed = ((Date.now() - anchor) % CYCLE + CYCLE) % CYCLE;
      var left = Math.min(3600, Math.ceil((CYCLE - elapsed) / 1000));
      document.getElementById('h').textContent = pad(Math.floor(left / 3600));
      document.getElementById('m').textContent = pad(Math.floor(left % 3600 / 60));
      document.getElementById('s').textContent = pad(left % 60);
      document.getElementById('fill').style.width = ((3600 - left) / 36) + '%';
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
